<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#f8a9c8"><meta name="description" content="母ちゃんの漢字道場。オフラインで楽しめる4択学習ゲーム。">
<link rel="manifest" href="manifest.webmanifest">
<title>母ちゃんの漢字道場</title>
<style>
:root{--ink:#56352e;--pink:#f36b9c;--cream:#fffaf0;--blue:#6ec8ee;--gold:#f4c65d}
*{box-sizing:border-box}body{margin:0;color:var(--ink);font-family:"Noto Sans JP","Noto Sans CJK JP","Yu Gothic UI","Yu Gothic","Meiryo",sans-serif;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;font-synthesis:none;background:linear-gradient(135deg,#fff0f6,#fff8e9 55%,#e9f8ff);min-height:100vh}
body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.55;background-image:radial-gradient(circle at 10% 15%,#fff 0 3px,transparent 4px),radial-gradient(circle at 80% 25%,#f8b9d0 0 5px,transparent 6px),radial-gradient(circle at 20% 80%,#f8b9d0 0 4px,transparent 5px);background-size:130px 130px}
.app{position:relative;max-width:760px;margin:auto;padding:14px 14px 32px}.top{display:flex;justify-content:space-between;align-items:center;gap:10px}.pill{border:2px solid #f4a5c2;border-radius:22px;background:#fff;padding:8px 13px;font-weight:900;font-size:17px}
h1{text-align:center;font-size:clamp(30px,8vw,48px);line-height:1.15;margin:16px 0 8px;color:#9d3f65;text-shadow:2px 3px #fff}
.sub{text-align:center;font-weight:800;font-size:17px;margin-bottom:12px}
.panel{background:#ffffffdf;border:3px solid #f6bfd1;border-radius:25px;padding:16px;box-shadow:0 6px 0 #efc2d0,0 12px 25px #9c648022;margin:14px 0}
.hero{display:flex;align-items:center;justify-content:center;gap:18px;flex-wrap:wrap}.bird{width:160px;height:160px;border-radius:28px;background:linear-gradient(145deg,#fff,#ffe4ef);display:grid;place-items:center;position:relative;border:3px solid #f4bfd1;box-shadow:inset 0 0 20px #fff}
.bird .creature{font-size:94px;filter:drop-shadow(0 5px 3px #8d536344)}.bird .lv{position:absolute;right:5px;bottom:5px;background:#fff;border:2px solid #d77a9c;border-radius:15px;padding:3px 9px;font-weight:1000;font-size:18px}
.level{font-size:38px;font-weight:1000;color:#d64d83}.meter{height:14px;border-radius:20px;background:#f5dce5;overflow:hidden;margin-top:8px}.meter>i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ff9fc3,#f5c65e);transition:width .25s}
button{font:inherit;cursor:pointer;border:0;touch-action:manipulation}.big{width:100%;padding:17px 12px;border-radius:19px;background:linear-gradient(#ff8bb4,#ed5488);color:white;font-weight:1000;font-size:24px;box-shadow:0 5px 0 #b63d6a;margin:6px 0;text-shadow:0 1px #a33}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.choice{background:#fff;border:3px solid #f0b8cb;border-radius:17px;padding:17px 10px;min-height:76px;font-size:clamp(20px,5vw,27px);font-weight:900;color:#593a3a;box-shadow:0 4px 0 #e9cad4}.choice:active,.big:active{transform:translateY(3px);box-shadow:none}.choice:disabled{opacity:.65}
.question{font-size:clamp(25px,7vw,38px);font-weight:1000;text-align:center;white-space:pre-line;line-height:1.45;padding:20px 6px 10px;min-height:145px;display:grid;place-items:center}
.answer-hint{text-align:center;font-size:clamp(24px,6.2vw,30px);font-weight:1000;line-height:1.35;color:#a74470;margin:2px 0 18px;padding:4px 8px}
.message{text-align:center;font-size:clamp(25px,7vw,36px);font-weight:1000;color:#df4c82;margin:10px}.feedback{font-size:clamp(32px,8vw,44px);text-align:center;font-weight:900;line-height:1.35;padding:22px 14px;margin:18px 0 14px;min-height:82px;display:flex;align-items:center;justify-content:center;overflow-wrap:anywhere}.correct{color:#178e62}.wrong{color:#d83e54}
.hidden{display:none!important}.muted{text-align:center;color:#866d70;font-size:15px;font-weight:700}.secondary{background:#fff;border:2px solid #e6a8bf;color:#8e4664;border-radius:15px;padding:13px;font-size:19px;font-weight:900;width:100%;margin:5px 0}.toast{font-size:22px;font-weight:1000;text-align:center;color:#c84c7b}
.home-exit-banner{width:min(100%,520px);margin:22px auto 4px;padding:13px 16px;border:3px solid #eaa7c0;border-radius:22px;background:linear-gradient(135deg,#fff,#fff0f6);box-shadow:0 4px 0 #efc8d7;text-align:center}.home-exit-banner button{width:100%;border:2px solid #e6a8bf;border-radius:16px;background:#fff;color:#8e4664;padding:15px 12px;font-size:22px;font-weight:900}.screen-footer{display:flex;gap:12px;margin:22px 0 4px;padding-top:15px;border-top:2px solid #f4d2de}.screen-footer button{flex:1;min-width:0;border:2px solid #e6a8bf;border-radius:16px;background:#fff;color:#8e4664;padding:14px 8px;font-size:clamp(17px,4.5vw,21px);font-weight:900;box-shadow:0 3px 0 #efd0db}.screen-footer button:last-child{background:#fff4f5;color:#a3445c}.exit-panel{text-align:center;padding:34px 18px}.exit-panel h2{font-size:30px;line-height:1.4}.exit-panel p{font-size:20px;line-height:1.7;font-weight:700}
@media(max-width:420px){.bird{width:138px;height:138px}.bird .creature{font-size:78px}.grid{gap:8px}.choice{padding:14px 5px;min-height:72px}}
/* Keep the home menu compact while allowing scrolling on very short screens. */
.app:has(#home:not(.hidden)){padding:8px 10px 12px}
.app:has(#home:not(.hidden)) h1{font-size:clamp(23px,7vw,38px);margin:8px 0 4px}
.app:has(#home:not(.hidden)) .sub{font-size:14px;margin-bottom:6px}
#home{padding:8px;margin:8px 0 4px}
#home .hero{flex-wrap:nowrap;gap:8px}
#home .bird{flex:0 0 auto;width:clamp(60px,13dvh,104px);height:clamp(60px,13dvh,104px)}
#home .creature{font-size:clamp(34px,8dvh,62px)}
#home .bird .lv{font-size:12px;padding:1px 5px;right:2px;bottom:2px}
#home .level{font-size:28px;text-align:center}
#home .muted{font-size:13px}
#home .meter{height:8px;margin-top:5px}
#nextText{margin:4px 0}
#home .big{font-size:19px;padding:9px 6px;margin:4px 0 7px}
#home .grid{gap:5px}
#home .secondary{font-size:clamp(13px,4vw,17px);min-height:40px;padding:5px 2px;margin:0}
#home > .secondary{margin-top:5px}
#home .home-exit-banner{margin:5px auto 0;padding:0;border:0;background:none;box-shadow:none}
#home .home-exit-banner button{font-size:16px;min-height:40px;padding:5px}
#progressText{font-size:17px;color:#9d3f65;margin:4px 0 8px}
@media(max-height:600px){
  .app:has(#home:not(.hidden)) .pill{font-size:14px;padding:4px 9px}
  #home .bird{width:64px;height:64px}
  #home .creature{font-size:38px}
  #home .level{font-size:23px}
}
#game #feedback{
  position:fixed;
  z-index:10;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  width:min(420px,calc(100% - 32px));
  max-height:calc(100dvh - 32px);
  overflow:auto;
  display:block;
  margin:0;
  padding:24px 16px;
  border:3px solid currentColor;
  border-radius:24px;
  background:#fff;
  box-shadow:0 0 0 150vmax #35212b88,0 12px 24px #35212b40;
  white-space:pre-line;
}
#game #feedback.correct{background:#f1fff7}
#game #feedback.wrong{background:#fff3f5}
#game:has(#feedback:not(.hidden):not(:empty)) .grid,
#game:has(#feedback:not(.hidden):not(:empty)) .screen-footer{pointer-events:none}
#game #feedback:empty{display:none}
</style></head>
<body><main class="app">
<div class="top"><span class="pill">🌸 春の漢字道場</span><span class="pill" id="topLevel">Lv 0</span></div>
<h1>母ちゃんの漢字道場</h1><div class="sub">楽しく挑戦！めざせ漢字マスター 🐦</div>
<section id="home" class="panel">
 <div class="hero"><div class="bird"><span class="creature" id="homeBird">🥚</span><span class="lv" id="homeBirdLv">Lv 0</span></div>
 <div><div class="muted">現在のレベル</div><div class="level" id="homeLevel">0</div><div class="muted">正解を重ねて鳥を育てよう！</div></div></div>
 <div class="meter"><i id="meterFill"></i></div><p class="muted" id="nextText">次の進化まであと10問！</p>
 <button class="big" onclick="startGame('all')">▶ ゲームスタート</button>
 <div class="grid">
 <button class="secondary" onclick="startGame('kanji')">漢字の読み</button>
 <button class="secondary" onclick="startGame('idiom_meaning')">四字熟語の意味</button>
 <button class="secondary" onclick="startGame('idiom_hole')">四字熟語の穴埋め</button>
 <button class="secondary" onclick="startGame('history')">歴史・発明問題</button></div>
 <button class="secondary" onclick="showRules()">遊び方・ルール</button>
 <div class="home-exit-banner"><button onclick="quitApp()">今日はやめる</button></div>
</section>
<section id="game" class="panel hidden">
 <div class="top"><span class="pill" id="categoryLabel">漢字の読み</span><span class="pill" id="gameLevel">Lv 0</span></div>
 <div class="question" id="questionText">問題</div><div class="muted" id="progressText">第1問</div><div class="answer-hint">正解を選んでね！</div><div class="grid" id="choices"></div>
 <div class="feedback hidden" id="feedback" role="status" aria-atomic="true"></div>
 
 <div class="screen-footer"><button onclick="goHome()">ホームに戻る</button><button onclick="quitApp()">やめる</button></div>
</section>
<section id="result" class="panel hidden">
 <div class="message" id="resultTitle"></div><div class="hero"><div class="bird"><span class="creature" id="resultBird">🐣</span><span class="lv" id="resultBirdLv">Lv 0</span></div></div>
 <div class="feedback" id="resultText"></div>
 <button class="big" onclick="startGame(currentMode)">もう一度挑戦する</button>
 <button class="secondary" onclick="goHome()">他のゲームを選択</button>
 <div class="screen-footer"><button onclick="goHome()">ホームに戻る</button><button onclick="quitApp()">やめる</button></div>
</section>
<section id="rules" class="panel hidden"><h2>遊び方</h2><p style="font-size:20px;line-height:1.7;font-weight:800">4つの選択肢から正解を選ぼう！正解するとレベルアップ。不正解はレベル0に戻るよ。10レベルごとに鳥が進化し、レベル100で鳳凰に！問題は同じレベル帯で重複しないようにランダムで出題するよ。</p><button class="big" onclick="goHome()">戻る</button><div class="screen-footer"><button onclick="goHome()">ホームに戻る</button><button onclick="quitApp()">やめる</button></div></section>
<section id="exitScreen" class="panel exit-panel hidden"><h2>🌸 今日はここまで！</h2><p>おつかれさまでした。<br>この画面を閉じて終了してください。</p><button class="big" onclick="goHome()">ホーム画面に戻る</button></section>
</main>
<script src="app.js"></script>
</body></html>
